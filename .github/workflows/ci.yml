name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight deps
        # Full requirements.txt includes GPU-only fine-tuning packages
        # (torch/bitsandbytes/etc.) that aren't needed to lint or run the
        # unit test suite and would slow CI down significantly -- install
        # only what's needed for that here.
        run: |
          pip install ruff pytest
          pip install langgraph langchain-core openai requests \
                      docker scikit-learn rank_bm25 faiss-cpu numpy \
                      fastapi pydantic

      - name: Lint (ruff)
        run: ruff check .

      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/test_docker_sandbox_integration.py

      - name: Run Docker-dependent tests (auto-skip if no daemon)
        run: pytest tests/test_docker_sandbox_integration.py -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Type-check + production build
        run: npm run build
